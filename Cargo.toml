[package]
name = "rust-stl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

description = "Educational, dependency-free reimplementation of classic STL-style containers in Rust"
documentation = "https://docs.rs/rust-stl"
repository = "https://github.com/rohan3155/rust-stl"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["collections", "vector", "data-structures", "no-dependencies"]
categories = ["data-structures", "algorithms"]

# The crate is intentionally dependency-free. Anything added here needs a clear
# justification in the pull request that adds it.
[dependencies]

# Examples are grouped by collection under `examples/<collection>/`. Cargo only
# auto-discovers `examples/*.rs` and `examples/*/main.rs`, so the nested,
# namespaced examples are declared explicitly here. The target names are kept
# stable (`basic_usage`, `iteration`, …) so existing commands keep working.
[[example]]
name = "basic_usage"
path = "examples/vector/basic_usage.rs"

[[example]]
name = "capacity_management"
path = "examples/vector/capacity_management.rs"

[[example]]
name = "filtering_and_sorting"
path = "examples/vector/filtering_and_sorting.rs"

[[example]]
name = "iteration"
path = "examples/vector/iteration.rs"

# The benchmark is a hand-rolled, dependency-free harness rather than a
# libtest/criterion benchmark, so the default harness is disabled. See
# `benches/vector/main.rs` for what it does and does not claim. Benchmarks are
# grouped by collection, so the path is declared explicitly.
[[bench]]
name = "vector"
path = "benches/vector/main.rs"
harness = false
